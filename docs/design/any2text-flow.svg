<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="970" viewBox="0 0 1560 970" role="img" aria-labelledby="title desc">
<title id="title">Any2Text UI 交互总图</title><desc id="desc">导入素材、长任务队列、字幕校对、整理成稿、导出交付五个页面，包含模型缺失、暂停、取消、中断恢复和整理失败的分支。所有进度与文字为设计示意。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5 1 9" fill="none" stroke="#737982" stroke-width="1.5"/></marker><style>
text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#252735} .h{font-size:26px;font-weight:600}.t{font-size:18px;font-weight:600}.b{font-size:15px}.s{font-size:13px;fill:#696e7a}.tiny{font-size:12px;fill:#696e7a}.panel{fill:#fff;stroke:#d9dcd9;stroke-width:1.2}.chrome{fill:#f1f0eb}.line{fill:none;stroke:#737982;stroke-width:1.5;marker-end:url(#arrow)}.rule{stroke:#d9dcd9;stroke-width:1}.accent{fill:#4c56b8}.soft{fill:#eceefa}.warn{fill:#f8f0e2;stroke:#e8d8be;stroke-width:1}.white{fill:#fff}.caption{font-size:15px;fill:#4c56b8}
</style></defs>
<rect width="1560" height="970" fill="#fbfaf7"/>
<text x="48" y="56" class="h">比格熊 Any2Text · UI 交互总图</text><text x="48" y="88" class="b" fill="#696e7a">U01–U05 · 核心操作与恢复路径；页面布局以 v0.4 可点击原型为准。</text><text x="1270" y="56" class="s">v0.4 / 2026.11.12</text>

<g transform="translate(48 135)"><text class="t" y="0">01 导入素材</text><rect class="panel" y="20" width="424" height="232" rx="9"/><path class="chrome" d="M1 29Q1 21 9 21H415Q423 21 423 29V54H1Z"/><text x="15" y="43" class="tiny">Any2Text / 导入</text><rect x="16" y="72" width="225" height="106" rx="5" fill="#fbfaf7" stroke="#c8ccc8" stroke-dasharray="4 4"/><text x="43" y="116" class="b">拖入音视频文件</text><text x="43" y="144" class="s">城市记忆访谈 · 02:00:00</text><text x="260" y="92" class="s">选择音轨</text><rect class="panel" x="256" y="103" width="151" height="29" rx="4"/><text x="266" y="123" class="tiny">中文访谈 / 音轨 1</text><text x="260" y="154" class="s">模型就绪 · 句级时间</text><rect class="accent" x="256" y="195" width="151" height="38" rx="5"/><text class="b white" x="298" y="220">开始转写</text><text x="16" y="220" class="s">保留原文件</text><text y="284" class="caption">明确音轨、模型和输出能力</text></g>

<path class="line" d="M484 273H550"/><text x="491" y="254" class="tiny">受理</text>
<g transform="translate(568 135)"><text class="t" y="0">02 长任务队列</text><rect class="panel" y="20" width="424" height="232" rx="9"/><path class="chrome" d="M1 29Q1 21 9 21H415Q423 21 423 29V54H1Z"/><text x="15" y="43" class="tiny">Any2Text / 任务</text><text x="20" y="88" class="b">城市记忆访谈.mp4</text><text x="20" y="125" class="t">64%</text><text x="87" y="125" class="s">服务已提交 153 / 240 块</text><rect class="chrome" x="20" y="143" width="384" height="7" rx="3"/><rect class="accent" x="20" y="143" width="246" height="7" rx="3"/><text x="20" y="180" class="s">当前阶段：分块识别 · 剩余时间待估算</text><rect class="panel" x="20" y="199" width="75" height="32" rx="4"/><text x="43" y="220" class="s">暂停</text><rect class="panel" x="106" y="199" width="75" height="32" rx="4"/><text x="129" y="220" class="s">取消</text><rect class="soft" x="230" y="199" width="174" height="32" rx="4"/><text x="251" y="220" class="b">查看本地文稿</text><text y="284" class="caption">服务完成 → 取回保存 → 本地可用</text></g>

<path class="line" d="M1004 273H1070"/><text x="1008" y="254" class="tiny">回听</text>
<g transform="translate(1088 135)"><text class="t" y="0">03 字幕校对</text><rect class="panel" y="20" width="424" height="232" rx="9"/><path class="chrome" d="M1 29Q1 21 9 21H415Q423 21 423 29V54H1Z"/><text x="15" y="43" class="tiny">Any2Text / 校对</text><rect class="chrome" x="16" y="70" width="225" height="78" rx="5"/><path d="M30 108h8m5-16v30m8-39v49m8-32v15m8-27v39m8-49v64m8-43v25m8-34v44m8-54v64m8-46v28m8-39v49m8-31v16m8-29v42m8-49v56m8-39v22m8-32v43m8-27v14m8-23v33m8-37v42m8-28v13" stroke="#7e86c5" stroke-width="3" fill="none"/><text x="16" y="173" class="tiny">00:38:47　嗯，就是每天早上……</text><rect class="soft" x="16" y="183" width="225" height="29" rx="3"/><text x="23" y="203" class="tiny">00:38:53　会记得它的声音。</text><text x="258" y="86" class="s">原文只读 / 校订另存</text><rect class="panel" x="256" y="101" width="151" height="74" rx="4"/><text x="268" y="128" class="s">每天早上，早点铺</text><text x="268" y="152" class="s">开门的声音……</text><rect class="accent" x="256" y="195" width="151" height="38" rx="5"/><text x="298" y="220" class="b white">保存校订</text><text y="284" class="caption">点字幕定位；原文与校订分版本</text></g>

<path class="line" d="M258 430V448"/><rect class="warn" x="48" y="464" width="424" height="72" rx="7"/><text x="66" y="492" class="b">未连接 / 无音轨 / 缺模型 → 阻断并给动作</text><text x="66" y="516" class="s">连接服务、修正素材或选择可用模型</text>
<path class="line" d="M780 430V448"/><rect class="warn" x="568" y="464" width="424" height="72" rx="7"/><text x="586" y="492" class="b">暂停、取消、退出、失败 → 保留检查点</text><text x="586" y="516" class="s">重连原提供方查询；保留有效检查点</text>

<path class="line" d="M1298 430V555H781V600"/><text x="1034" y="545" class="s">整理成稿</text>
<path class="line" d="M1420 430V600"/><text x="1432" y="545" class="s">直接导出</text>
<g transform="translate(568 630)"><text class="t" y="0">04 整理成稿</text><rect class="panel" y="20" width="424" height="210" rx="9"/><path class="chrome" d="M1 29Q1 21 9 21H415Q423 21 423 29V54H1Z"/><text x="15" y="43" class="tiny">Any2Text / 整理</text><rect class="soft" x="16" y="70" width="85" height="29" rx="4"/><text x="35" y="90" class="s">口播稿</text><text x="117" y="90" class="s">文学剧本</text><text x="20" y="126" class="b">一座城市，不只有看得见的街道，</text><text x="20" y="154" class="b">还有听得见的记忆。</text><text x="20" y="195" class="s">来源引用 → 原音 / 校订 v2</text><rect class="accent" x="286" y="176" width="121" height="37" rx="5"/><text x="318" y="201" class="b white">接受此稿</text><text y="261" class="caption">分章候选；原文更新则提示待核对</text></g>
<path class="line" d="M1004 755H1070"/><text x="1008" y="735" class="tiny">接受</text>
<g transform="translate(1088 630)"><text class="t" y="0">05 导出交付</text><rect class="panel" y="20" width="424" height="210" rx="9"/><path class="chrome" d="M1 29Q1 21 9 21H415Q423 21 423 29V54H1Z"/><text x="15" y="43" class="tiny">Any2Text / 导出</text><text x="20" y="89" class="b">字幕 / 原文 → SRT、VTT、TXT、JSON</text><text x="20" y="121" class="b">接受的稿件 → TXT、Markdown</text><text x="20" y="157" class="s">明确版本与覆盖范围；改写稿不套原音时间</text><rect class="accent" x="20" y="176" width="122" height="37" rx="5"/><text x="52" y="201" class="b white">导出文件</text><rect class="panel" x="155" y="176" width="249" height="37" rx="5"/><text x="182" y="201" class="s">连接 ai-story 后发送候选</text><text y="261" class="caption">文件可打开；消费方决定应用位置</text></g>

<rect class="warn" x="48" y="650" width="424" height="210" rx="7"/><text x="68" y="684" class="t">稿件与导出的关键约束</text><text x="68" y="720" class="b">未保存校订：先保存再生成 / 导出</text><text x="68" y="753" class="b">来源已更新：旧候选不能直接接受</text><text x="68" y="786" class="b">整理失败：只重试未完成章节</text><text x="68" y="826" class="s">原文 / 校订分开选择；改写稿仅导出文本</text>
<line x1="48" y1="923" x2="1512" y2="923" class="rule"/><text x="48" y="952" class="s">设计提案 / 所有进度和文案为示意，不代表运行性能或模型效果。实际验收见开发计划 P0–P4。</text>
</svg>

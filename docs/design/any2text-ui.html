<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Any2Text · UI 交互原型</title>
<style>
:root{color-scheme:light dark;--paper:light-dark(#f4f5f8,#191b21);--panel:light-dark(#fff,#22252d);--side:light-dark(#eef0f5,#14161c);--ink:light-dark(#232936,#edf0f7);--muted:light-dark(#637083,#abb5c7);--line:light-dark(#dce1e9,#3c4351);--accent:light-dark(#4655b5,#a7b5ff);--selected:light-dark(#edf0ff,#303951);--solid:light-dark(#4655b5,#a7b5ff);--on:light-dark(#fff,#171e37);--warn:light-dark(#8a5115,#f2c68d);--softwarn:light-dark(#fff4e4,#3d3022);--ok:light-dark(#276650,#9bd6bd)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit}button,input,select,textarea,summary,a{outline-offset:3px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent)}button{min-height:36px;border:1px solid var(--line);border-radius:6px;padding:6px 12px;background:var(--panel);color:var(--ink);cursor:pointer}button:hover:not(:disabled){border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--solid);color:var(--on);border-color:var(--solid)}button.quiet{background:transparent;border-color:transparent}h1,h2,h3,p{margin:0}h1{font-size:20px;font-weight:650}h2{font-size:15px;font-weight:650}h3{font-size:14px}a{color:var(--accent)}.muted,.small{color:var(--muted)}.small{font-size:12px}.mono{font:12px Consolas,monospace;font-variant-numeric:tabular-nums}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:12px;min-width:0;grid-template-columns:minmax(0,1fr);align-content:start}.stack>*{min-width:0}.badge{font-size:12px;padding:2px 8px;border-radius:5px;background:var(--side);white-space:nowrap}.shell{display:grid;grid-template-columns:152px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--side);border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:22px}.brand{font-size:18px;font-weight:700;padding:0 8px;letter-spacing:-.6px}.nav{display:grid;gap:4px}.nav button{display:flex;gap:10px;align-items:center;border-color:transparent;text-align:left;background:transparent;min-height:40px}.nav button[aria-current=page]{color:var(--accent);background:var(--panel);border-color:var(--line)}.num{font:11px Consolas,monospace;color:var(--muted)}.main{min-width:0}.top{height:50px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}.content{padding:18px 20px;display:grid;gap:14px;max-width:1600px;margin:auto}.panel{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:16px}.cols{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:14px;align-items:start}.cols>*{min-width:0}.cols.review{grid-template-columns:minmax(0,1.8fr) minmax(300px,1fr)}.field{display:grid;gap:5px}.field>span{font-size:12px;color:var(--muted)}input[type=search],input[type=text],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:var(--panel)}textarea{min-height:150px;resize:vertical;line-height:1.85}.editbox textarea{min-height:170px}.draft{min-height:390px}.notice{background:var(--selected);padding:9px 12px;border-radius:6px;font-size:13px}.warning{background:var(--softwarn);color:var(--warn)}.drop{border:1px dashed var(--line);padding:30px 16px;display:grid;justify-items:center;gap:9px;border-radius:7px;background:var(--paper)}.file{display:flex;gap:12px;align-items:center;padding:10px 0}.filemark{padding:10px;border:1px solid var(--line);border-radius:6px;font-size:11px}.meter{height:6px;overflow:hidden;border-radius:6px;background:var(--side)}.meter>span{display:block;height:100%;background:var(--accent)}.bigprogress{font-size:28px;font-variant-numeric:tabular-nums}.statrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.statrow strong{display:block;font-size:15px;font-weight:500}.jobline{padding:9px 0;border-bottom:1px solid var(--line)}.player{padding:12px 16px;border:1px solid var(--line);border-radius:9px;background:var(--panel);display:grid;gap:6px}.wave{height:42px;display:flex;gap:3px;align-items:center;overflow:hidden}.wave i{background:var(--muted);min-width:2px;flex:1;opacity:.35;border-radius:2px}.wave i:nth-child(-n+26){background:var(--accent);opacity:.8}.timeline{width:100%;accent-color:var(--accent)}.segments{max-height:335px;overflow:auto;overscroll-behavior:contain}.segment{display:grid;grid-template-columns:76px minmax(0,1fr) 22px;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:11px 8px}.segment[aria-pressed=true]{background:var(--selected)}.stamp{font-size:12px;font-variant-numeric:tabular-nums;color:var(--accent)}.mark{font-size:11px;color:var(--muted)}.status{font-size:12px;color:var(--ok)}.tabs{display:flex;gap:7px}.tabs button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:var(--selected)}.preview{background:var(--side);padding:14px;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;max-height:490px;overflow:auto}.rule{border:0;border-top:1px solid var(--line);margin:2px 0}.toast{font-size:12px;color:var(--accent)}.toast:empty{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.search{max-width:260px}.demo{border-top:1px solid var(--line);padding-top:8px}.demo summary,summary{cursor:pointer;font-size:12px;color:var(--muted)}.demo .row{margin-top:8px}.demo-info{position:relative}.demo-info>p{position:absolute;right:0;top:25px;width:280px;z-index:5;border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:12px;box-shadow:0 5px 20px #0002;font-size:12px}.source{border-left:2px solid var(--line);padding-left:12px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.source-original{color:var(--muted);font-size:13px}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.review .editbox{position:sticky;top:16px}
@media(max-width:1100px){.shell{grid-template-columns:130px minmax(0,1fr)}.brand{font-size:16px}.content{padding:16px}.cols,.cols.review{grid-template-columns:minmax(0,1.4fr) minmax(270px,1fr)}.panel{padding:14px}.top{padding:0 16px}}
@media(max-width:850px){.shell{display:block}.sidebar{padding:10px 14px;gap:8px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:16px}.nav{display:flex;flex-wrap:wrap;gap:3px}.nav button{padding:5px 9px;min-height:36px}.num{display:none}.top{height:auto;min-height:44px;padding:8px 14px}.content{padding:14px}.cols,.cols.review{grid-template-columns:1fr}.review .editbox{position:static}.draft{min-height:280px}.desktoplabel{display:none}.segments{max-height:290px}}
@media(max-width:420px){.content{padding:12px;gap:12px}.panel{padding:12px}.row{gap:6px}.segment{grid-template-columns:64px minmax(0,1fr);gap:8px}.mark{display:none}.fieldrow{grid-template-columns:1fr}.top .small{font-size:11px}button{padding:7px 10px}.search{max-width:none;width:100%}}
</style></head><body>
<div class="shell"><aside class="sidebar"><div class="brand">Any2Text</div><nav class="nav" aria-label="工作区导航" id="nav"></nav></aside><div class="main"><header class="top row between"><span class="small">城市记忆访谈 <span class="desktoplabel muted">· 02:00:00</span></span><button id="providerStatus" type="button" data-action="provider" class="quiet small">比格熊 · 已连接</button><details class="demo-info"><summary>演示 v0.4</summary><p>素材、进度和文稿均为示例。仅演示界面与定位，不播放媒体或调用模型。编辑在刷新后重置，下载仅包含示例内容。</p></details></header><main id="main" class="content"></main></div></div>
<script>
(()=>{'use strict';
const names=['导入素材','任务队列','字幕校对','整理成稿','导出交付'];
const original=[
{t:2322,end:2327,text:'我们最初想做的，其实是把这些老街的声音留下来。'},
{t:2327,end:2333,text:'嗯，就是每天早上，早点铺开门的时候，那个声音特别熟悉。'},
{t:2333,end:2338,text:'你可能不记得一条街的样子，但是会记得它的声音。'},
{t:2338,end:2343,text:'所以我们用了两个月，去记录不同时间的街道。'},
{t:2343,end:2349,text:'不只是采访，还有那些停顿，脚步声，和远处的叫卖声。'},
{t:2349,end:2353,text:'它们在一起，才是我们记忆里的那座城市。'}];
const state={connected:true,disconnectAsk:false,page:2,ready:true,loaded:true,job:'succeeded',saved:240,selected:1,time:2327,search:'',texts:original.map(x=>x.text),edits:{},revision:1,kind:'voice',mode:'faithful',tone:'自然讲述',length:'保持信息完整',instruction:'',draft:'',accepted:'',draftSource:0,draftKind:'voice',exportSource:'subtitle',format:'srt',toast:'',model:'Whisper · 本地（示例）',language:'中文',track:'音轨 1 · 中文访谈',cancelAsk:false};
const $=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clock=x=>[Math.floor(x/3600),Math.floor(x%3600/60),Math.floor(x%60)].map(n=>String(n).padStart(2,'0')).join(':');
const btn=(text,action,cls='',disabled=false)=>`<button type="button" data-action="${action}" class="${cls}" ${disabled?'disabled':''}>${text}</button>`;
const options=(values,selected)=>values.map(v=>`<option ${v===selected?'selected':''}>${esc(v)}</option>`).join('');
const heading=()=>`<div class="toolbar"><h1>${names[state.page]}</h1><span class="small">${state.page===2?'校订 v'+state.revision:''}</span></div>`;
function notify(text){state.toast=text;const out=$('toast');if(out)out.textContent=text;}
function go(page){state.page=page;state.toast='';render();}
function render(){
 $('providerStatus').textContent='比格熊 · '+(state.connected?'已连接':'未连接');
 $('nav').innerHTML=names.map((x,i)=>`<button type="button" data-page="${i}" ${state.page===i?'aria-current="page"':''}><span class="num">0${i+1}</span>${x}</button>`).join('');
 $('main').innerHTML=providerPanel()+[importPage,tasksPage,reviewPage,writePage,exportPage][state.page]()+`<div id="toast" role="status" aria-live="polite" class="toast">${esc(state.toast)}</div>`;
}
function providerPanel(){return state.providerOpen?`<section class="panel stack" aria-label="服务连接"><div class="row between"><h2>服务连接</h2>${btn('收起','provider','quiet')}</div><p class="small">比格熊 · ${state.connected?'已连接（演示）':'未连接'} · 已保存文稿可离线使用</p>${state.disconnectAsk?`<div class="notice warning"><p>${state.job==='result_pending'?'结果待取回，断开后需重连比格熊取回。':'此任务仍属于比格熊，断开后需重连查询状态。'}</p><div class="actions">${btn('保留任务并断开','keep-disconnect')}${['running','pausing','paused','cancelling','recoverable'].includes(state.job)?btn('请求取消并断开','cancel-disconnect'):''}${btn('返回','dismiss-disconnect')}</div></div>`:btn(state.connected?'断开连接':'连接比格熊',state.connected?'disconnect':'connect')}<span class="small">原型不连接真实服务；其他提供方暂未接入。</span></section>`:'';}
function importPage(){return heading()+`<div class="cols"><section class="panel stack"><div class="drop"><h2>选择音视频</h2>${btn('载入示例素材','load','primary')}<span class="small">MP4、MOV、MP3、WAV 等</span></div>${state.loaded?`<div class="file"><span class="filemark">MP4</span><div><h3>城市记忆访谈.mp4</h3><p class="small">02:00:00 · 2 条音轨</p></div></div>`:''}</section><aside class="panel stack"><h2>转写设置</h2><label class="field"><span>音轨</span><select id="track">${options(['音轨 1 · 中文访谈','音轨 2 · 环境声'],state.track)}</select></label><label class="field"><span>识别模型</span><select id="model">${options(['Whisper · 本地（示例）','Qwen3-ASR · 待安装（示例）'],state.model)}</select></label><label class="field"><span>语言</span><select id="language">${options(['中文','自动检测','英语'],state.language)}</select></label>${!state.connected?'<div class="notice warning">未连接比格熊，请先连接服务。</div>':state.ready?'<span class="status">比格熊提供 · 句级时间</span>':'<div class="notice warning">模型未准备，请切换到可用模型。</div>'}${btn('开始转写','start','primary',!state.loaded||!state.ready||!state.connected)}</aside></div>`;}
function tasksPage(){const labels={running:'正在转写',pausing:'正在保存当前片段',paused:'已暂停',cancelling:'正在停止任务',recoverable:'处理中断',failed:'转写失败',cancelled:'已取消',result_pending:'结果待取回',succeeded:'已保存到本工具'};const pct=Math.round(state.saved/240*100);return heading()+`<div class="cols"><section class="panel stack"><div class="row between"><h2>城市记忆访谈.mp4</h2><span class="badge">${!state.connected&&state.job!=='succeeded'?'未连接 · 状态待核对':labels[state.job]}</span></div><div class="row between"><strong class="bigprogress">${pct}%</strong><span class="small">已识别 ${clock(state.saved*30)} / 02:00:00</span></div><div class="meter" role="progressbar" aria-label="识别进度" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div><div class="statrow"><div><span class="small">服务已提交片段</span><strong>${state.saved} / 240</strong></div><div><span class="small">预计剩余</span><strong>${['succeeded','result_pending'].includes(state.job)?'已完成':'正在估算'}</strong></div></div>${['failed','recoverable','cancelled'].includes(state.job)?'<div class="notice warning">服务保留已提交片段，可继续未完成部分。</div>':''}<div class="actions">${state.job==='running'?btn('暂停','pause','',!state.connected):''}${['paused','recoverable','failed','cancelled'].includes(state.job)?btn('继续未完成部分','resume','primary',!state.connected):''}${['running','pausing','paused','failed','recoverable'].includes(state.job)?btn('取消任务','cancel','',!state.connected):''}${state.job==='result_pending'?btn('取回并保存','retrieve','primary',!state.connected):''}${btn('查看本地文稿','review',state.job==='succeeded'?'primary':'')}</div>${state.cancelAsk?`<div class="notice warning"><p>取消后保留已完成内容，之后可继续。</p><div class="actions">${btn('确认取消','confirm-cancel')}${btn('继续当前任务','dismiss-cancel')}</div></div>`:''}<details class="demo"><summary>演示状态</summary><div class="row">${btn('模拟中断','interrupt','',state.job!=='running')}${btn('模拟失败','fail','',state.job!=='running')}${btn('完成当前片段','settle-pause','',state.job!=='pausing')}${btn('确认进程停止','settle-cancel','',state.job!=='cancelling')}${btn('演示完成','finish','',state.job!=='running')}</div></details></section><aside class="panel stack"><h2>队列</h2><div class="jobline"><h3>城市记忆访谈.mp4</h3><p class="small">${!state.connected&&state.job!=='succeeded'?'未连接 · 状态待核对':labels[state.job]}</p></div><div><h3>补充录音.m4a</h3><p class="small">00:18:24 · 等待中</p></div></aside></div>`;}
function listMarkup(){const hits=original.map((x,i)=>({...x,text:state.texts[i],i})).filter(x=>x.text.includes(state.search));return hits.length?hits.map(x=>`<button type="button" class="segment" data-segment="${x.i}" aria-pressed="${state.selected===x.i}"><span class="stamp">${clock(x.t)}</span><span>${esc(x.text)}</span><span class="mark">${String(x.i+1).padStart(2,'0')}</span></button>`).join(''):'<p class="muted" style="padding:16px">没有匹配的示例字幕</p>';}
function reviewPage(){const sel=original[state.selected];return heading()+`<div class="toolbar"><span class="small">本地文稿 · 6 段示例 · 00:38:42—00:39:13</span><div class="actions">${btn('导出字幕','export-subtitle')}${btn('整理成稿','write','primary')}</div></div><div class="cols review"><section class="stack"><div class="player"><div class="row between"><h3>音轨 1 · 中文访谈</h3><span class="mono"><span id="currentTime">${clock(state.time)}</span> / 02:00:00</span></div><div class="wave" aria-hidden="true">${Array.from({length:80},(_,i)=>`<i style="height:${8+Math.round(Math.abs(Math.sin(i*1.7)*Math.cos(i*.37))*32)}px"></i>`).join('')}</div><input id="seek" class="timeline" aria-label="媒体位置示意" type="range" min="0" max="7200" value="${state.time}"><div class="row">${btn('前 5 秒','back','quiet')}${btn('后 5 秒','forward','quiet')}</div></div><section class="panel stack"><div class="toolbar"><h2>字幕</h2><input class="search" id="search" aria-label="搜索字幕" type="search" value="${esc(state.search)}" placeholder="搜索字幕"></div><div class="segments" id="segments">${listMarkup()}</div></section></section><aside class="panel stack editbox"><div class="row between"><h2>校订当前句</h2><span class="mono">${clock(sel.t)}—${clock(sel.end)}</span></div><details class="source-original"><summary>识别原文</summary><p>${esc(sel.text)}</p></details><label class="field"><span>校订文字</span><textarea id="edit">${esc(state.edits[state.selected]??state.texts[state.selected])}</textarea></label><div class="row between"><span id="saveStatus" class="status">${state.edits[state.selected]!==undefined?'未保存':'已保存 · v'+state.revision}</span>${btn('保存校订','save','primary')}</div><span class="small">保留句级时间</span></aside></div>`;}
function writePage(){const outdated=state.draftSource&&state.draftSource!==state.revision;const dirty=Object.keys(state.edits).length>0;return heading()+`<div class="cols"><section class="panel stack"><div class="row between"><div class="tabs"><button type="button" data-kind="voice" aria-pressed="${state.kind==='voice'}">口播稿</button><button type="button" data-kind="script" aria-pressed="${state.kind==='script'}">文学剧本</button></div><span id="candidateStatus" class="badge">${state.accepted?'已接受':state.draft?'待接受':'未生成'}</span></div>${outdated?'<div class="notice warning">来源已更新，请重新生成并核对后接受。</div>':''}${dirty?`<div class="notice warning">有未保存校订。${btn('返回保存','review','quiet')}</div>`:''}<label class="field"><span>候选文稿</span><textarea id="draft" class="draft" placeholder="生成候选后，在这里编辑和核对。">${esc(state.draft)}</textarea></label><div class="row between"><span class="small">${state.draftSource?'来源 v'+state.draftSource:'基于校订 v'+state.revision}</span>${btn('接受此稿','accept','primary',!state.draft||Boolean(outdated)||dirty)}</div></section><aside class="panel stack"><h2>整理设置</h2>${!state.connected?'<div class="notice warning">未连接服务，已保存稿件仍可编辑导出。</div>':''}${state.kind==='script'?`<label class="field"><span>改写程度</span><select id="mode"><option value="faithful" ${state.mode==='faithful'?'selected':''}>忠实整理</option><option value="creative" ${state.mode==='creative'?'selected':''}>创作改编 · 标记新增</option></select></label>`:''}<label class="field"><span>风格</span><select id="tone">${options(['自然讲述','简洁有力','温柔叙事'],state.tone)}</select></label><label class="field"><span>篇幅</span><select id="length">${options(['保持信息完整','压缩重复表达'],state.length)}</select></label><label class="field"><span>补充要求</span><input type="text" id="instruction" value="${esc(state.instruction)}" placeholder="选填"></label>${btn(state.draft?'重新生成候选':'生成候选','generate','primary',dirty||!state.connected)}${btn('导出已接受稿','export-draft','',!state.accepted||Boolean(outdated)||dirty)}<hr class="rule"><div class="source"><span class="small">来源片段</span><p>${esc(state.texts[2])}</p>${btn('回看 00:38:53 →','source','quiet')}</div></aside></div>`;}
function getExport(){if(state.exportSource==='draft')return state.accepted||'';const exportTexts=state.exportSource==='original'?original.map(x=>x.text):state.texts;if(state.format==='txt'||state.format==='md')return exportTexts.join('\n');if(state.format==='json')return JSON.stringify({demo:true,partialSample:true,revision:state.exportSource==='original'?0:state.revision,segments:original.map((x,i)=>({id:'sample-'+(i+1),startMs:x.t*1000,endMs:x.end*1000,text:exportTexts[i]}))},null,2);const isVtt=state.format==='vtt';return (isVtt?'WEBVTT\n\nNOTE 演示片段，非完整两小时转写\n\n':'')+original.map((x,i)=>`${i+1}\n${clock(x.t)}${isVtt?'.':','}000 --> ${clock(x.end)}${isVtt?'.':','}000\n${exportTexts[i]}\n`).join('\n');}
function exportPage(){const stale=state.exportSource==='draft'&&state.draftSource!==state.revision;const dirty=Object.keys(state.edits).length>0&&state.exportSource!=='original';const invalid=dirty||state.exportSource==='draft'&&(!state.accepted||stale||['srt','vtt'].includes(state.format));const allowed=state.exportSource==='draft'?['txt','md']:['srt','vtt','txt','json'];return heading()+`<div class="cols"><section class="panel stack"><h2>导出内容</h2><label class="field"><span>成果来源</span><select id="exportSource"><option value="subtitle" ${state.exportSource==='subtitle'?'selected':''}>校订字幕 · v${state.revision}</option><option value="original" ${state.exportSource==='original'?'selected':''}>识别原文 · 只读</option><option value="draft" ${state.exportSource==='draft'?'selected':''}>已接受的${state.draftKind==='voice'?'口播稿':'文学剧本'}</option></select></label><label class="field"><span>文件格式</span><select id="format">${allowed.map(x=>`<option value="${x}" ${state.format===x?'selected':''}>${x.toUpperCase()}</option>`).join('')}</select></label><div class="notice ${invalid?'warning':''}">${dirty?'有未保存校订，请返回校对保存。':state.exportSource==='draft'?(stale?'来源已更新，请重新核对并接受稿件。':!state.accepted?'请先生成并接受稿件。':'改写稿仅导出文本；制作字幕需新配音对齐。'):'范围：00:38:42—00:39:13 · 6 段示例。'}</div><div class="row between"><span class="small muted">城市记忆访谈-示例.${esc(state.format)}</span>${btn('下载示例文件','download','primary',invalid)}</div><hr class="rule"><h2>连接创作工具</h2>${btn('发送到 ai-story · 尚未接通','send','',true)}</section><aside class="panel stack"><div class="row between"><h2>内容预览</h2></div><pre class="preview">${esc(getExport()||'尚未接受稿件，请先完成整理。')}</pre></aside></div>`;}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.disabled)return;if(el.dataset.page!==undefined){go(Number(el.dataset.page));return;}if(el.dataset.segment!==undefined){state.selected=Number(el.dataset.segment);state.time=original[state.selected].t;render();return;}if(el.dataset.kind){if(state.kind!==el.dataset.kind){if(state.draft&&!confirm('切换稿件类型将清空当前示例候选，原文不受影响。继续？'))return;state.kind=el.dataset.kind;state.draft='';state.accepted='';state.draftSource=0;}render();return;}const a=el.dataset.action;if(!a)return;
 switch(a){
 case'provider':state.providerOpen=!state.providerOpen;render();break;
 case'disconnect':if(['running','pausing','paused','cancelling','recoverable','failed','result_pending'].includes(state.job)){state.disconnectAsk=true;}else{state.connected=false;}render();break;
 case'keep-disconnect':state.connected=false;state.disconnectAsk=false;render();notify('已断开；旧任务需重新连接比格熊查询。');break;
 case'cancel-disconnect':state.connected=false;state.disconnectAsk=false;state.job='cancelling';render();notify('已请求取消并断开，取消结果待核对。');break;
 case'dismiss-disconnect':state.disconnectAsk=false;render();break;
 case'connect':state.connected=true;state.disconnectAsk=false;render();notify('已恢复演示连接；旧任务仍归比格熊。');break;
case'load':state.loaded=true;render();notify('已载入预设两小时素材。未访问本机文件。');break;
 case'start':if(!state.connected)return;state.job='running';state.saved=153;state.cancelAsk=false;go(1);notify('演示进入 64% 进度，未实际提交识别。');break;
 case'pause':state.job='pausing';render();notify('正在保存当前片段。');break;
 case'settle-pause':state.job='paused';render();break;
 case'settle-cancel':state.job='cancelled';render();break;
 case'resume':state.job='running';state.cancelAsk=false;render();notify('演示：继续未完成片段，已保存进度未重置。');break;
 case'cancel':state.cancelAsk=true;render();break;
 case'confirm-cancel':state.job='cancelling';state.cancelAsk=false;render();notify('正在停止任务，已保存成果保留。');break;
 case'dismiss-cancel':state.cancelAsk=false;render();break;
 case'interrupt':state.job='recoverable';state.cancelAsk=false;render();break;
 case'fail':state.job='failed';state.cancelAsk=false;render();notify('演示识别失败：已完成片段保留，可继续未完成部分。');break;
 case'finish':state.job='result_pending';state.saved=240;state.cancelAsk=false;render();notify('服务已生成，请取回并保存成果。');break;
 case'retrieve':if(!state.connected||state.job!=='result_pending')break;state.job='succeeded';render();notify('示例成果已保存到本工具。');break;
 case'review':go(2);break;case'write':go(3);break;
 case'back':state.time=Math.max(0,state.time-5);render();break;case'forward':state.time=Math.min(7200,state.time+5);render();break;
 case'chapter-start':state.time=0;render();notify('已定位示意起点；示例字幕仅覆盖 00:38:42—00:39:13。');break;
 case'chapter-current':state.time=2322;render();break;case'chapter-end':state.time=7180;render();notify('已定位示意结尾；此处未提供演示字幕。');break;
 case'save':{const text=$('edit').value.trim();if(!text){notify('校订文本不能为空。');break;}if(text!==state.texts[state.selected]){state.texts[state.selected]=text;state.revision++;}delete state.edits[state.selected];render();notify('已保存到页面内的校订版本 v'+state.revision+'，原文保留。');break;}
 case'generate':if(!state.connected){notify('请先连接服务。');return;}if(Object.keys(state.edits).length){notify('请先保存校订。');return;}if(state.draft&&!confirm('重新生成将替换当前示例候选。继续？'))return;state.draft=state.kind==='voice'?'【示例口播稿 · 仅来自六段示例】\n\n一座城市，不只有看得见的街道，还有听得见的记忆。\n\n早点铺开门的声音、街上的脚步声、远处的叫卖声，让一条老街变得熟悉。我们用两个月，记录下它们在不同时间的模样。\n\n你也许会忘记一条街的样子，却会记得它的声音。那些声音聚在一起，就是我们记忆里的城市。':'【示例文学剧本 · '+(state.mode==='creative'?'创作改编':'忠实整理')+'】\n\n人物：受访者（真实身份未确认）\n场景：原音未提供可核实场景\n\n受访者：我们最初想做的，是把老街的声音留下来。\n\n受访者：你可能不记得一条街的样子，但是会记得它的声音。\n\n旁白〔整理转述〕：他们用两个月记录不同时间的街道。脚步声、叫卖声与停顿，构成了城市的记忆。'+(state.mode==='creative'?'\n\n〔新增创作，非原音事实〕受访者打开录音机，停下来，听街道慢慢苏醒。':'');state.draftSource=state.revision;state.draftKind=state.kind;state.accepted='';render();notify('预置候选已载入；正式产品将按原文分章生成并检查覆盖。');break;
 case'accept':if(!state.draft.trim()||state.draftSource!==state.revision||Object.keys(state.edits).length){notify('请先生成有效且来源一致的候选。');return;}state.accepted=state.draft;state.draftKind=state.kind;render();notify('示例候选已接受，原始转写没有被覆盖。');break;
 case'source':state.selected=2;state.time=2333;state.search='';go(2);break;
 case'export-subtitle':if(Object.keys(state.edits).length){notify('请先保存校订再导出。');return;}state.exportSource='subtitle';state.format='srt';go(4);break;
 case'export-draft':state.exportSource='draft';state.format='txt';go(4);break;
 case'download':{if(Object.keys(state.edits).length&&state.exportSource!=='original'){notify('请先保存校订。');return;}if(state.exportSource==='draft'&&(!state.accepted||state.draftSource!==state.revision||['srt','vtt'].includes(state.format))){notify('稿件状态或格式不允许导出。');return;}let text=getExport();if(state.format==='txt'||state.format==='md')text='【Any2Text UI 原型导出：演示文本，非真实媒体转写】\n\n'+text;const blob=new Blob([text],{type:state.format==='json'?'application/json;charset=utf-8':'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='城市记忆访谈-示例.'+state.format;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('已发起示例文件下载。');break;}
 }
});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='search'){state.search=el.value;$('segments').innerHTML=listMarkup();}if(el.id==='edit'){state.edits[state.selected]=el.value;$('saveStatus').textContent='未保存';}if(el.id==='draft'){state.draft=el.value;state.accepted='';if($('candidateStatus'))$('candidateStatus').textContent='候选稿 · 修改未接受';const accept=document.querySelector('[data-action="accept"]');if(accept)accept.disabled=!state.draft.trim()||state.draftSource!==state.revision||Object.keys(state.edits).length>0;const exp=document.querySelector('[data-action="export-draft"]');if(exp)exp.disabled=true;notify('候选有未接受的修改。');}if(el.id==='instruction')state.instruction=el.value;if(el.id==='seek'){state.time=Number(el.value);$('currentTime').textContent=clock(state.time);}});

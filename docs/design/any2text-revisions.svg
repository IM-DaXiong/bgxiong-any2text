<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1030" viewBox="0 0 1400 1030" role="img"><title>A03 · 文稿修订与服务可替换性</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#65748b"/></marker><style>text{font-family:Segoe UI,Microsoft YaHei,sans-serif;fill:#283449}.h{font-size:27px;font-weight:650}.t{font-size:19px;font-weight:650}.b{font-size:16px}.s{font-size:14px;fill:#63728a}.e{fill:none;stroke:#65748b;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1400" height="1030" fill="#f5f7fb"/><text x="40" y="48" class="h">A03 · 文稿修订与服务可替换性</text><text x="40" y="82" class="b">本地文稿 ID、源时间和校订修订独立于提供方；生成仍通过选定服务执行。</text>
<rect x="40" y="140" width="400" height="155" rx="10" fill="#fff" stroke="#cad4e1"/>
<text x="58" y="171" class="t">客户端：原始转写副本</text>
<text x="58" y="200" class="b">从提供方取回并本地落盘</text>
<text x="58" y="225" class="b">规范化段 ID / 源毫秒时间</text>
<text x="58" y="250" class="b">原始内容只读，保留 provenance</text>
<rect x="500" y="140" width="400" height="155" rx="10" fill="#eef1ff" stroke="#a2aee0"/>
<text x="518" y="171" class="t">客户端：校订版本</text>
<text x="518" y="200" class="b">自有 ID / parentRevision</text>
<text x="518" y="225" class="b">expectedRevision 防并发覆盖</text>
<text x="518" y="250" class="b">未保存修改先处理，再生成 / 导出</text>
<rect x="960" y="140" width="400" height="155" rx="10" fill="#fff" stroke="#cad4e1"/>
<text x="978" y="171" class="t">客户端：原文 / 校订导出</text>
<text x="978" y="200" class="b">选择明确来源与覆盖范围</text>
<text x="978" y="225" class="b">TXT / JSON；有效时间 → SRT / VTT</text>
<text x="978" y="250" class="b">本地操作，不调用提供方</text>
<path class="e" d="M440 215H495"/>
<path class="e" d="M900 215H955"/>
<rect x="500" y="365" width="400" height="160" rx="10" fill="#fff" stroke="#cad4e1"/>
<text x="518" y="396" class="t">提供方：分章整理任务</text>
<text x="518" y="425" class="b">冻结 sourceRevision 与原文段范围</text>
<text x="518" y="450" class="b">复用宿主文本内核、密钥与费用</text>
<text x="518" y="475" class="b">失败仅重做未完成章节</text>
<text x="518" y="500" class="b">结果待取回，不直接覆盖本地稿</text>
<path class="e" d="M700 295V360"/>
<rect x="40" y="590" width="400" height="150" rx="10" fill="#eef1ff" stroke="#a2aee0"/>
<text x="58" y="621" class="t">客户端：候选修订</text>
<text x="58" y="650" class="b">取回 / 原子保存 / 登记</text>
<text x="58" y="675" class="b">sourceSegmentIds + 新增标记</text>
<text x="58" y="700" class="b">来源变化：标过期，保留旧文稿</text>
<rect x="500" y="590" width="400" height="150" rx="10" fill="#fff" stroke="#cad4e1"/>
<text x="518" y="621" class="t">客户端：接受与编辑</text>
<text x="518" y="650" class="b">核对来源后由用户接受</text>
<text x="518" y="675" class="b">再次编辑 → 未接受</text>
<text x="518" y="700" class="b">原文不被候选覆盖</text>
<rect x="960" y="590" width="400" height="150" rx="10" fill="#fff" stroke="#cad4e1"/>
<text x="978" y="621" class="t">客户端：稿件交付</text>
<text x="978" y="650" class="b">TXT / Markdown 可离线导出</text>
<text x="978" y="675" class="b">改写稿不继承原音字幕时间</text>
<text x="978" y="700" class="b">发送到比格熊创作为可选扩展</text>
<path class="e" d="M700 525V555H240V585"/>
<path class="e" d="M440 665H495"/>
<path class="e" d="M900 665H955"/>
<rect x="40" y="812" width="1320" height="130" rx="10" fill="#fff5e7" stroke="#d9c7ab"/>
<text x="58" y="843" class="t">切换提供方的边界</text>
<text x="58" y="872" class="b">新任务可走新适配器；旧任务固定 providerId / endpointInstance / taskId / attemptId，不转发给新提供方。</text>
<text x="58" y="897" class="b">已取回文稿仍可用；未取回结果需重连原提供方。第二生产适配器后置，用进程外替身验证端口可替换。</text>
<text x="40" y="1005" class="s">v0.4 · 2026-11-12 · 拟议设计；不表示服务门面、持久检查点或客户端已实现。</text>
</svg>